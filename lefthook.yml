pre-commit:
  commands:
    check-merge-conflict:
      run: grep -rEn "^(<<<<<<< |=======|>>>>>>> )" {staged_files} && exit 1 || exit 0

    shellcheck:
      glob: "{*.sh,shell/**/*.sh,bash/.*,zsh/.*}"
      run: shellcheck --shell=bash -x -e SC1090 -e SC1091 -e SC2016 -e SC2148 {staged_files}

    shfmt:
      glob: "{*.sh,shell/**/*.sh,bash/.*}"
      run: shfmt -w -s -i 4 -bn -ci {staged_files}

